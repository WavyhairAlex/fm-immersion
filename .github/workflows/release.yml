name: Release

# Publier une version :
#   1. passer "version" à X.Y.Z dans apps/desktop/package.json et apps/desktop/src-tauri/Cargo.toml,
#      puis fusionner sur main : le workflow démarre seul (pas de tag à pousser à la main) ;
#   2. c'est tout : la release « FM Immersion vX.Y.Z » est créée dans ce dépôt (public), publiée et marquée
#      « Latest » automatiquement, et les applis installées la récupèrent à leur prochain démarrage.
# La release reste en brouillon le temps d'envoyer tous les fichiers, puis n'est publiée que si
# latest.json (lu par le système de mise à jour) est bien présent : jamais de « Latest » incomplète.
# Si une release vX.Y.Z existe déjà, le workflow ne fait rien.
#
# Secret requis : TAURI_SIGNING_PRIVATE_KEY (clé minisign des mises à jour, voir tauri.conf.json).
# Tant qu'il manque, le workflow s'arrête sans rien publier.
on:
  push:
    branches: [main]
    paths: ['apps/desktop/package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version et vérifier qu'elle n'est pas déjà publiée
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          CARGO=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | cut -d'"' -f2)
          test "$VERSION" = "$CARGO" || { echo "package.json ($VERSION) différent de Cargo.toml ($CARGO)"; exit 1; }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            echo "Secret TAURI_SIGNING_PRIVATE_KEY absent : rien n'est publié."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "La release v$VERSION existe déjà : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.version.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.version.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - if: steps.version.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # NSIS (outil de l'installeur) : tauri build le télécharge depuis les releases GitHub de tauri-apps à chaque
      # build, sans nouvel essai. Le 08/11/2026, ces téléchargements ont répondu 504 pendant des heures et aucune
      # version n'a pu sortir (0.1.59 à 0.1.69). On le garde en cache, et sinon on le télécharge ici avec de
      # nouveaux essais, au même endroit et avec les mêmes empreintes que tauri-bundler 2.12 (nsis/mod.rs).
      - if: steps.version.outputs.skip != 'true'
        id: nsis-cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: tauri-nsis-3.11-utils-0.5.3
      - name: Préparer NSIS (avec nouveaux essais)
        if: steps.version.outputs.skip != 'true' && steps.nsis-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$LOCALAPPDATA/tauri"
          mkdir -p "$TOOLS"
          # Chaque essai passe par toutes les adresses connues du fichier ; la somme SHA-1 (celle de tauri-bundler)
          # garantit que c'est le même fichier, quelle que soit la source. NSIS est aussi publié sur SourceForge par
          # ses auteurs (même archive, même SHA-1), utile quand les releases GitHub répondent 502/503/504.
          get() { # fichier, sha1 attendu, adresses...
            local out="$1" sum="$2"; shift 2
            for i in $(seq 1 12); do
              for url in "$@"; do
                if curl -fsSL --max-time 300 -o "$out" "$url" \
                  && [ "$(sha1sum "$out" | cut -d' ' -f1 | tr a-f A-F)" = "$sum" ]; then echo "OK : $url"; return 0; fi
                echo "Essai $i : $url indisponible."
              done
              sleep 20
            done
            echo "Téléchargement impossible : $out"; return 1
          }
          get "$RUNNER_TEMP/nsis.zip" EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D \
            https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip \
            https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip
          get "$RUNNER_TEMP/nsis_tauri_utils.dll" 75197FEE3C6A814FE035788D1C34EAD39349B860 \
            https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll
          rm -rf "$TOOLS/NSIS" "$TOOLS/nsis-3.11"
          unzip -q "$RUNNER_TEMP/nsis.zip" -d "$TOOLS"
          mv "$TOOLS/nsis-3.11" "$TOOLS/NSIS"
          mkdir -p "$TOOLS/NSIS/Plugins/x86-unicode/additional"
          cp "$RUNNER_TEMP/nsis_tauri_utils.dll" "$TOOLS/NSIS/Plugins/x86-unicode/additional/"
          ls "$TOOLS/NSIS"

      # Signature Windows (Authenticode) : à brancher ici avec SignPath une fois le projet accepté.
      # Les fichiers de mise à jour, eux, sont déjà signés avec la clé TAURI_SIGNING_PRIVATE_KEY.
      - if: steps.version.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/desktop
          owner: amnesix-nt
          repo: fm-immersion
          tagName: ${{ steps.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: FM Immersion ${{ steps.version.outputs.tag }}
          releaseBody: FM Immersion ${{ steps.version.outputs.tag }}. Mise à jour installée automatiquement au prochain démarrage de l'appli.
          # Brouillon pendant l'envoi des fichiers ; publié à l'étape suivante.
          releaseDraft: true
          prerelease: false

      # Publication et statut « Latest » : les applis installées lisent
      # releases/latest/download/latest.json (tauri.conf.json). On vérifie d'abord que latest.json
      # et l'installeur sont bien attachés, sinon la release reste en brouillon et le job échoue.
      - name: Publier la release et la marquer « Latest »
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          echo "$ASSETS" | grep -qx 'latest.json' || { echo "latest.json absent : release laissée en brouillon."; exit 1; }
          echo "$ASSETS" | grep -q -- '-setup\.exe$' || { echo "Installeur absent : release laissée en brouillon."; exit 1; }
          gh release edit "$TAG" --draft=false --latest
          echo "Release $TAG publiée et marquée Latest."
