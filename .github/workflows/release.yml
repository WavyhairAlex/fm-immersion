name: Release

# Publier une version :
#   1. passer "version" à X.Y.Z dans apps/desktop/package.json et apps/desktop/src-tauri/Cargo.toml ;
#   2. pousser un tag vX.Y.Z ;
#   3. relire le brouillon de release créé sur GitHub, puis le publier.
# Une fois publiée, les applis installées la récupèrent à leur prochain démarrage.
#
# Le code reste dans ce dépôt privé ; les versions sont publiées dans le dépôt public amnesix-nt/simloom,
# seul endroit que l'appli installée peut lire sans compte (tauri.conf.json, fm_bridge.rs).
# Secret requis : SIMLOOM_RELEASES_TOKEN, jeton à grain fin limité à amnesix-nt/simloom, droit « Contents : écriture ».
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile

      - name: Vérifier que le tag correspond à la version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME différent de la version $VERSION"; exit 1; }

      # Signature Windows (Authenticode) : à brancher ici avec SignPath une fois le projet accepté.
      # Les fichiers de mise à jour, eux, sont déjà signés avec la clé TAURI_SIGNING_PRIVATE_KEY.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.SIMLOOM_RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/desktop
          owner: amnesix-nt
          repo: simloom
          tagName: ${{ github.ref_name }}
          releaseName: Simloom ${{ github.ref_name }}
          releaseBody: Notes de version à compléter avant publication.
          releaseDraft: true
          prerelease: false
