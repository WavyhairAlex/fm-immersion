name: Release

# Publier une version :
#   1. passer "version" à X.Y.Z dans apps/desktop/package.json et apps/desktop/src-tauri/Cargo.toml,
#      puis fusionner sur main : le workflow démarre seul (pas de tag à pousser à la main) ;
#   2. relire le brouillon de release « Simloom vX.Y.Z » créé dans amnesix-nt/simloom, puis le publier.
# Si une release vX.Y.Z existe déjà dans amnesix-nt/simloom, le workflow ne fait rien.
# Une fois publiée, les applis installées la récupèrent à leur prochain démarrage.
#
# Le code reste dans ce dépôt privé ; les versions sont publiées dans le dépôt public amnesix-nt/simloom,
# seul endroit que l'appli installée peut lire sans compte (tauri.conf.json, fm_bridge.rs).
# Secret requis : SIMLOOM_RELEASES_TOKEN, jeton à grain fin limité à amnesix-nt/simloom, droit « Contents : écriture ».
on:
  push:
    branches: [main]
    paths: ['apps/desktop/package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version et vérifier qu'elle n'est pas déjà publiée
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SIMLOOM_RELEASES_TOKEN }}
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          CARGO=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | cut -d'"' -f2)
          test "$VERSION" = "$CARGO" || { echo "package.json ($VERSION) différent de Cargo.toml ($CARGO)"; exit 1; }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo amnesix-nt/simloom > /dev/null 2>&1; then
            echo "La release v$VERSION existe déjà dans amnesix-nt/simloom : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.version.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.version.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - if: steps.version.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # Signature Windows (Authenticode) : à brancher ici avec SignPath une fois le projet accepté.
      # Les fichiers de mise à jour, eux, sont déjà signés avec la clé TAURI_SIGNING_PRIVATE_KEY.
      - if: steps.version.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.SIMLOOM_RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/desktop
          owner: amnesix-nt
          repo: simloom
          tagName: ${{ steps.version.outputs.tag }}
          # Le tag est créé dans amnesix-nt/simloom : il doit pointer sur une branche de ce dépôt-là,
          # pas sur le commit du dépôt privé (sinon « target_commitish invalid »).
          releaseCommitish: main
          releaseName: Simloom ${{ steps.version.outputs.tag }}
          releaseBody: Notes de version à compléter avant publication.
          releaseDraft: true
          prerelease: false
