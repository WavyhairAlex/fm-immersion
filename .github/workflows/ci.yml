name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Dépendances système de Tauri (Linux, pour compiler et tester)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Tests Rust
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  # L'appli ne tourne que sous Windows : mêmes tests sur une machine Windows, pour attraper ce qui ne se voit
  # pas sous Linux (chemins, lecture en mémoire, processus, NSIS…).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Tests Rust
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  # Plugin FM27 compilé sans le jeu, avec nos modèles de compilation (modules/fm/bridge/stubs, voir son README).
  # Seule ArchivixBridge.dll est gardée : les modèles ne sont jamais livrés.
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compiler le plugin (modèles de compilation)
        run: dotnet build modules/fm/bridge/ArchivixBridge.csproj -c Release -p:Stubs=true
      - uses: actions/upload-artifact@v4
        with:
          name: ArchivixBridge
          path: modules/fm/bridge/bin/Release/net6.0/ArchivixBridge.dll
          if-no-files-found: error
