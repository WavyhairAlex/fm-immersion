[package]
name = "simloom"
version = "0.1.23"
description = "Simloom — le compagnon de tes parties de jeux de gestion"
authors = ["Simloom"]
license = "MIT"
repository = "https://github.com/amnesix-nt/simloom"
edition = "2021"
rust-version = "1.80"

[lib]
name = "simloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
# Plugin FM27 : téléchargement depuis GitHub Releases (sur demande) et vérification SHA-256
ureq = "2"
sha2 = "0.10"
# Planet Zoo 2 : exports de Zoologix (registre JSON, plan PNG) transmis en base64 par la page
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
